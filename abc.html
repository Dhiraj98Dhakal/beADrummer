<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background: black;
            color:  white;
            padding: 10px 10px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active{
            background-color: white;
            color: black;
            transform: scale(1.05);
            border: none;
        }
    </style>
</head>
<body>
    <button>
        click me 
    </button>
</body>
</html>
